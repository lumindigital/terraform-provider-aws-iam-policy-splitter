name: template-go

modules:
  - name: github.com/Lumin-Digital/stencil-flavor-go
    version: v0.2.0

arguments:
  lumin_repo_name: template-go
  lumin_flavor: Go
  lumin_doc_repo_description: |-
    TEMPLATE REPO - Go template repo
  github_primary_team: Site Reliability Engineers
  github_additional_teams: []
  dependabot_config_ecosystems:
    - gomod
    - docker
    - github-actions
  readme_full_doc_about: |-
    This is a `stencil`-managed [Github template repository](https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-template-repository) for Go projects.
    Once the repository has been provisioned from this template, `stencil` will manage the configuration contained therein to ensure that it remains up-to-date with the latest, Lumin-defined best practices and conventions.
    Configuration for `stencil` can be found in [`stencil.yaml`](./stencil.yaml) at the root of the repository.
    Default values should suffice for most use-cases, but can be set/overridden as needed.
    Setting, at least, the following values is recommended:
    - `lumin_repo_name`
    - `lumin_doc_repo_description`
    - `github_primary_team`
