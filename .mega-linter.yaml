# .mega-linter.yaml
# BE ADVISED: This file was @generated by the Lumin Digital lumin-stencil project
# For more information, please see: https://github.com/Lumin-Digital/lumin-stencil
# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/latest/config-file/ and in linters documentation

### MegaLinter Configuration ###
# Extend from base configuration
EXTENDS:
  - .base.mega-linter.yaml
APPLY_FIXES: true
SHOW_ELAPSED_TIME: true
# Enable if you want MegaLinter to detect errors but not block CI to pass
DISABLE_ERRORS: false
## Linters Configuration ##
# If you use the ENABLE_LINTERS variable, all other linters will be disabled by
# default
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_EXEC
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - COPYPASTE_JSCPD
  - JSON_PRETTIER
  - MARKDOWN_MARKDOWNLINT
  - MARKDOWN_MARKDOWN_LINK_CHECK
  - MARKDOWN_MARKDOWN_TABLE_FORMATTER
  - REPOSITORY_GIT_DIFF
  - REPOSITORY_GITLEAKS
  - XML_XMLLINT
  - YAML_PRETTIER

## Reporters Configuration ##
# ENABLED
CONSOLE_REPORTER: true
GITHUB_COMMENT_REPORTER: true
GITHUB_STATUS_REPORTER: true
SARIF_REPORTER: true
# DISABLED
API_REPORTER: false
TEXT_REPORTER: false
GITLAB_COMMENT_REPORTER: false
AZURE_COMMENT_REPORTER: false
BITBUCKET_COMMENT_REPORTER: false
UPDATED_SOURCES_REPORTER: false
CONFIG_REPORTER: false
FILEIO_REPORTER: false
JSON_REPORTER: false
EMAIL_REPORTER: false
TAP_REPORTER: false
MARKDOWN_SUMMARY_REPORTER: false