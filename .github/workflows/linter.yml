# .github/workflows/linter.yml
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
# BE ADVISED: This file was @generated by the Lumin Digital lumin-stencil project
# For more information, please see: https://github.com/Lumin-Digital/lumin-stencil
name: Linter - MegaLinter
run-name: Linter - MegaLinter from ${{ github.ref }} for ${{ github.event_name }} event

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      megalinter-validate-all-codebase:
        type: boolean
        description: "Whether to validate the entire codebase or just the changes (default: true)"
        default: true
      megalinter-apply-fixes:
        type: string
        description: "Apply linter fixes to the repository (default: all)"
        default: all
      megalinter-apply-fixes-event:
        type: string
        description: "Event to apply linter fixes (default: pull_request)"
        default: pull_request
      megalinter-apply-fixes-mode:
        type: string
        description: "Mode to apply linter fixes (default: commit)"
        default: commit

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write
  security-events: write

jobs:
  Setup-And-Run-MegaLinter:
    runs-on: ubuntu-latest
    env:
      APPLY_FIXES: ${{ github.event.inputs.megalinter-apply-fixes || 'all' }}
      APPLY_FIXES_EVENT: ${{ github.event.inputs.megalinter-apply-fixes-event || 'pull_request' }}
      APPLY_FIXES_MODE: ${{ github.event.inputs.megalinter-apply-fixes-mode || 'commit' }}
    concurrency:
      group: ${{ github.ref }}-${{ github.workflow }}
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHA_PUSH_PAT }}

      - name: Run MegaLinter
        id: run_megalinter
        uses: oxsecurity/megalinter/flavors/cupcake@v8.3.0
        env:
          VALIDATE_ALL_CODEBASE: ${{ github.event.inputs.megalinter-validate-all-codebase || true }}
          GITHUB_TOKEN: ${{ secrets.GHA_PUSH_PAT }}

      - name: Upload MegaLinter Artifacts
        uses: actions/upload-artifact@v4.6.0
        if: success() || failure()
        with:
          name: MegaLinter Reports
          path: |
            linter-output
            mega-linter.log
      ###########################################################
      # Create pull request if APPLY_FIXES_MODE is pull_request #
      ###########################################################
      - name: Create Pull Request with applied fixes
        uses: peter-evans/create-pull-request@v7.0.6
        id: create_pr
        if: >-
          steps.run_megalinter.outputs.has_updated_sources == 1 &&
          (
            env.APPLY_FIXES_EVENT == 'all' ||
            env.APPLY_FIXES_EVENT == github.event_name
          ) &&
          env.APPLY_FIXES_MODE == 'pull_request' &&
          (
            github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository
          ) &&
          !contains(github.event.head_commit.message, 'skip fix')
        with:
          token: ${{ secrets.GHA_PUSH_PAT }}
          commit-message: "[MegaLinter] Apply linters automatic fixes"
          title: "[MegaLinter] Apply linters automatic fixes"
          labels: |
            bot
            automated-pr
            linting
            megalinter
            code-quality

      - name: Create PR output
        if: >-
          steps.run_megalinter.outputs.has_updated_sources == 1 &&
          (
            env.APPLY_FIXES_EVENT == 'all' ||
            env.APPLY_FIXES_EVENT == github.event_name
          ) &&
          env.APPLY_FIXES_MODE == 'pull_request' &&
          (
            github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository
          ) &&
          !contains(github.event.head_commit.message, 'skip fix')
        run: |
          echo "PR Number - ${{ steps.create_pr.outputs.pull-request-number }}"
          echo "PR URL - ${{ steps.create_pr.outputs.pull-request-url }}"
      ###########################################################
      ############# END Optional PR Creation Steps ##############
      ###########################################################

      ###########################################################
      ####### Create commit if APPLY_FIXES_MODE is commit #######
      ###########################################################
      - name: Prepare commit
        if: >-
          steps.run_megalinter.outputs.has_updated_sources == 1 &&
          (
            env.APPLY_FIXES_EVENT == 'all' ||
            env.APPLY_FIXES_EVENT == github.event_name
          ) &&
          env.APPLY_FIXES_MODE == 'commit' &&
          github.ref != 'refs/heads/main' &&
          (
            github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository
          ) &&
          !contains(github.event.head_commit.message, 'skip fix')
        run: sudo chown -Rc $UID .git/

      - name: Commit and push applied linter fixes
        uses: stefanzweifel/git-auto-commit-action@v5.1.0
        if: >-
          steps.run_megalinter.outputs.has_updated_sources == 1 &&
          (
            env.APPLY_FIXES_EVENT == 'all' ||
            env.APPLY_FIXES_EVENT == github.event_name
          ) &&
          env.APPLY_FIXES_MODE == 'commit' &&
          github.ref != 'refs/heads/main' &&
          (
            github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository
          ) &&
          !contains(github.event.head_commit.message, 'skip fix')
        with:
          branch: >-
            ${{
              github.event.pull_request.head.ref ||
              github.head_ref ||
              github.ref
            }}
          commit_message: "[MegaLinter] Apply linters fixes"
          commit_user_name: megalinter-bot
          commit_user_email: sre@lumindigital.com
      ###########################################################
      ######### END Optional Commit Creation Steps ##############
      ###########################################################